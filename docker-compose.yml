# Aplikacja pixelforge NIE jest w tym compose — uruchamiana lokalnie (uvicorn)
# dla szybkiej iteracji między ćwiczeniami.
# Porty: pixelforge :8040 (lokalnie), Pyroscope :4040, origin :8041 (Docker, tylko 127.0.0.1).

services:
  pyroscope:
    # Oficjalny obraz grafana/pyroscope:2.4.2 jest typu distroless (brak shella,
    # curl, wget) — nie da się w nim uruchomić realnego healthchecku. Budujemy
    # go więc lokalnie (docker/pyroscope.Dockerfile): ten sam binarny pyroscope
    # (statyczny Go, bez zależności libc) skopiowany na alpine z curl.
    build:
      context: .
      dockerfile: docker/pyroscope.Dockerfile
    image: pyprof-pyroscope:2.4.2-curl
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - pyroscope_data:/data
    healthcheck:
      # Pyroscope po starcie ma wbudowane opóźnienia gotowości (metastore ~15s,
      # ingester ~15s, segment writer ~30s, sekwencyjnie) — realny czas do
      # pierwszego 200 na /ready to ok. 60-90s. start_period + retries muszą to
      # pokryć, inaczej healthcheck fałszywie zgłosi unhealthy.
      test: ["CMD", "curl", "-f", "http://localhost:4040/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  origin:
    # nginx = HTTP/1.1 z keep-alive (python -m http.server mówi HTTP/1.0 i zamyka
    # połączenie po każdej odpowiedzi, więc keep-alive nie miałby jak zadziałać).
    build:
      context: .
      dockerfile: docker/origin.Dockerfile
    image: pyprof-origin:nginx1.30-netem
    cap_add:
      - NET_ADMIN        # tylko dla tc netem (opóźnienie sieciowe)
    environment:
      # Opóźnienie odpowiedzi origin w ms (0 = brak). Zmiana: ORIGIN_DELAY_MS=0 docker compose up -d
      ORIGIN_DELAY_MS: ${ORIGIN_DELAY_MS:-25}
    volumes:
      - ./data/origin_images:/images:ro
      - ./docker/origin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8041:8041"
    healthcheck:
      # wget kończy się błędem dla HTTP >=400; listing katalogu (200) wystarcza jako sygnał gotowości.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8041/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  # Dane Pyroscope przetrwają restart (docker compose down bez -v jest bezpieczny
  # do powtarzania). Czysty start = `docker compose down -v`.
  pyroscope_data:
