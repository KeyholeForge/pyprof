# Serwis `origin`: statyczne obrazy po HTTP/1.1 z keep-alive (nginx).
server {
    listen 8041;
    root /images;
    autoindex on;            # loadgen czyta listę plików z katalogu głównego
    keepalive_timeout 65s;   # połączenia są utrzymywane między żądaniami
    keepalive_requests 10000;
    # Nagłówek ułatwia rozpoznanie serwera w haku `trace` / curl -v.
    add_header X-Origin "pyprof-origin" always;
    access_log off;

    # Liczniki nginx: `accepts` = przyjęte połączenia TCP, `requests` = obsłużone żądania.
    # Przy działającym keep-alive requests rośnie dużo szybciej niż accepts.
    location = /nginx_status {
        stub_status;
    }
}
