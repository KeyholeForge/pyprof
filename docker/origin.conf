# The `origin` service: static images over HTTP/1.1 with keep-alive (nginx).
server {
    listen 8041;
    root /images;
    autoindex on;            # loadgen reads the file list from the root directory
    keepalive_timeout 65s;   # connections are kept alive between requests
    keepalive_requests 10000;
    # The header makes the server easy to recognize in the `trace` hook / curl -v.
    add_header X-Origin "pyprof-origin" always;
    access_log off;

    # nginx counters: `accepts` = accepted TCP connections, `requests` = handled requests.
    # With keep-alive working, requests grows much faster than accepts.
    location = /nginx_status {
        stub_status;
    }
}
